global:
  prefix: cv-app

# -- Domain name for the application
domain: cv.example.com

# -- Ingress controller configuration
ingress:
  enabled: true
  # -- Ingress controller type: "traefik" or "nginx"
  controller: traefik
  annotations: {}
  tls:
    enabled: true

# -- cert-manager configuration for automatic TLS certificates
certManager:
  enabled: true
  # -- Create a ClusterIssuer resource (disable if you already have one)
  createClusterIssuer: true
  # -- Name of the ClusterIssuer to use (must match if createClusterIssuer is false)
  clusterIssuerName: letsencrypt-prod
  # -- Email for Let's Encrypt registration
  email: user@example.com
  # -- Use Let's Encrypt production server (false = staging for testing)
  production: true

# -- Traefik-specific settings (only used when ingress.controller=traefik)
traefik:
  # -- Create Traefik stripPrefix middleware for /api
  createMiddleware: true
  middleware:
    name: strip-api-prefix
    namespace: default

backend:
  replicaCount: 2
  image:
    repository: cr.selcloud.ru/dswz/cv-backend
    tag: 0.8.7
    pullPolicy: IfNotPresent
  containerPort: 8000
  service:
    port: 8000
  readinessProbe:
    path: /api/message
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    path: /api/message
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10

frontend:
  replicaCount: 2
  image:
    repository: cr.selcloud.ru/dswz/cv-frontend
    tag: 0.8.7
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    port: 80
  readinessProbe:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
