# .gitlab-ci.yml
stages:
  - build
  - deploy

variables:
  GODEBUG: "http2client=0"

# --- Build ---

build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - kubernetes
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/backend:latest"

build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - kubernetes
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend"
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/frontend:latest"

# --- Deploy ---

deploy:
  stage: deploy
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  tags:
    - kubernetes
  script:
    - export KUBECONFIG=${KUBECONFIG_FILE}
    - helm upgrade --install cv-app ./helm
      --namespace default
      --set backend.image.repository=${CI_REGISTRY_IMAGE}/backend
      --set backend.image.tag=${CI_COMMIT_SHORT_SHA}
      --set frontend.image.repository=${CI_REGISTRY_IMAGE}/frontend
      --set frontend.image.tag=${CI_COMMIT_SHORT_SHA}
      --set postgresql.password=${POSTGRES_PASSWORD}
      --wait
      --timeout 5m
  environment:
    name: production
    url: https://cv.dswz.ru
  only:
    - main
    - tags
