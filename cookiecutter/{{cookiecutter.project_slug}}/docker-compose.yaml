services:
{%- if cookiecutter.use_postgres == 'y' %}
  # PostgreSQL Database
  db:
    image: postgres:{{ cookiecutter.postgres_version }}
    environment:
      POSTGRES_DB: {{ cookiecutter.postgres_db }}
      POSTGRES_USER: {{ cookiecutter.postgres_user }}
      POSTGRES_PASSWORD: {{ cookiecutter.postgres_password }}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ cookiecutter.postgres_user }} -d {{ cookiecutter.postgres_db }}"]
      interval: 5s
      timeout: 5s
      retries: 5
{%- endif %}

  # Django Backend
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
{%- if cookiecutter.use_postgres == 'y' %}
      - DATABASE_URL=postgres://{{ cookiecutter.postgres_user }}:{{ cookiecutter.postgres_password }}@db:5432/{{ cookiecutter.postgres_db }}
{%- endif %}
      - DJANGO_DEBUG=true
      - DJANGO_ALLOWED_HOSTS=*
{%- if cookiecutter.use_cors == 'y' %}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:{{ cookiecutter.nginx_listen_port }}
{%- endif %}
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
{%- if cookiecutter.use_postgres == 'y' %}
    depends_on:
      db:
        condition: service_healthy
{%- endif %}
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped
{% if cookiecutter.use_nginx_proxy == 'y' %}
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "{{ cookiecutter.nginx_listen_port }}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./backend/static:/static:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
{%- endif %}
{% if cookiecutter.use_postgres == 'y' %}
volumes:
  postgres_data:
{%- endif %}
